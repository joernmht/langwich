  <rect x="28.8" y="83.4" width="9.4" height="7.4" rx="1" fill="#000" stroke-width=".5"/>
  <circle cx="33.5" cy="86.4" r="1.1" fill="#fff" stroke="none"/>
  <path d="M33.5,86.6 V89" stroke="#fff" stroke-width=".8"/>
  <!-- wheel clamp of the lower rack -->
  <path d="M131,64 H121 M131,70 H121" stroke-width="1.1"/>
