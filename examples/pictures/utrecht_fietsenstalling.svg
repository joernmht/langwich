    <circle cx="95" cy="33.6" r=".7" fill="#000" stroke="none"/>
    <path d="M97.8,32 L100,30.6"/>
    <path d="M90.4,29.6 Q89,27.8 89.8,25.8 M93.2,28 Q92.6,26.2 93.6,24.8 M96.4,28 Q96.8,26.4 98.2,25.6" stroke-width=".5"/>
  </g>
