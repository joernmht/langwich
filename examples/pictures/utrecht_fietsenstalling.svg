    <circle cx="166" cy="23.6" r="3.4"/>
    <path d="M155,23.6 L159.4,17.4 L164.8,17.4 L166,23.6 M159.4,17.4 L161.4,23.6 L155,23.6 M158.2,15.8 H160.6 M164.8,17.4 L164.2,15.2 H166.2"/>
  </g>
  <path d="M176,14 V20 M176,21.6 V27.6 M181,14 V20.6 H188 M188,14 V20 M188,21.6 V27.6" stroke-width="1.6" stroke-linecap="square"/>
  <!-- the number painted on the floor: 27 -->
  <g transform="translate(124 98) skewX(-18)" stroke-width="2.8">
    <path d="M1,3.6 Q1,0 6,0 Q11,0 11,3.8 Q11,7 1,14 H11.6"/>
    <path d="M17,0 H27.6 L20.6,14"/>
  </g>
  <!-- leader lines for the numbered markers -->
  <g stroke-width=".3">
    <line x1="60" y1="36" x2="68.4" y2="46.6"/>
    <line x1="82" y1="30" x2="91.8" y2="33"/>
    <line x1="170" y1="42" x2="170" y2="32.6"/>
    <line x1="144" y1="58" x2="134.4" y2="58"/>
    <line x1="164" y1="105" x2="150.4" y2="105"/>
    <line x1="33.5" y1="103" x2="33.5" y2="91.2"/>
  </g>
</svg>
