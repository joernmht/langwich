<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" stroke="#000" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- floor -->
  <line x1="3" y1="92" x2="197" y2="92" stroke-width=".6"/>
