    <rect x="20" y="20" width="3" height="72"/>
    <rect x="131" y="20" width="3" height="72"/>
    <rect x="16" y="20" width="122" height="3"/>
    <rect x="17" y="90.4" width="9" height="1.6"/>
    <rect x="128" y="90.4" width="9" height="1.6"/>
  </g>
  <!-- the bicycle -->
  <g fill="#fff">
    <circle cx="56" cy="77" r="15" stroke-width="1.5"/>
    <circle cx="56" cy="77" r="13" stroke-width=".35"/>
    <path d="M56,77 L68.8,79.0 M56,77 L65.2,86.2 M56,77 L58.0,89.8 M56,77 L50.1,88.6 M56,77 L44.4,82.9 M56,77 L43.2,75.0 M56,77 L46.8,67.8 M56,77 L54.0,64.2 M56,77 L61.9,65.4 M56,77 L67.6,71.1" stroke-width=".25" fill="none"/>
    <circle cx="56" cy="77" r="1.5" fill="#000" stroke="none"/>
    <circle cx="112" cy="77" r="15" stroke-width="1.5"/>
    <circle cx="112" cy="77" r="13" stroke-width=".35"/>
    <path d="M112,77 L124.8,79.0 M112,77 L121.2,86.2 M112,77 L114.0,89.8 M112,77 L106.1,88.6 M112,77 L100.4,82.9 M112,77 L99.2,75.0 M112,77 L102.8,67.8 M112,77 L110.0,64.2 M112,77 L117.9,65.4 M112,77 L123.6,71.1" stroke-width=".25" fill="none"/>
    <circle cx="112" cy="77" r="1.5" fill="#000" stroke="none"/>
  </g>
  <g stroke-width=".9">
    <path d="M39.2,79 A17,17 0 0 1 68.5,65.5"/>
    <path d="M99.5,65.5 A17,17 0 0 1 128.8,79"/>
    <path d="M75,58 H43 M47,58 L56,77 M70,58 L56,77" stroke-width=".8"/>
  </g>
  <g stroke-width="1.4">
    <path d="M80,77 L74.6,52"/>
    <path d="M102.2,50 Q92,74 80,77"/>
    <path d="M101.2,46 Q88,62 77,63"/>
    <path d="M112,77 Q108,66 103.4,54 L100.5,43"/>
    <path d="M100.5,43 L99.8,38.2 Q95,35.6 89.6,38.6"/>
    <path d="M89.6,38.6 L85,40.2" stroke-width="2.6"/>
  </g>
  <!-- chain guard, crank and pedal -->
  <path d="M56,72.4 L80,71.4 Q86.6,77 80,82.6 L56,81.6 Q51.2,77 56,72.4 Z" fill="#fff" stroke-width=".8"/>
  <path d="M80,77 L84.4,85" stroke-width="1.2"/>
  <path d="M81.4,86 H88.2" stroke-width="2"/>
  <!-- saddle -->
  <path d="M64.6,49.4 Q70,46.2 80.4,47.4 Q83.4,48 82.8,50.2 Q76,51.6 65.6,52.8 Q63.4,51.4 64.6,49.4 Z" fill="#000" stroke-width=".6"/>
  <!-- front lamp -->
