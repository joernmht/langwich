name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly, so a new release of a dependency shows up here before a user meets it
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # PDF tests fail instead of skipping when WeasyPrint or PyMuPDF cannot be loaded,
  # so a broken system-library step cannot hide behind a green run.
  LANGWICH_REQUIRE_PDF: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install WeasyPrint system libraries
        # The runner image ships Pango; only libharfbuzz-subset0 has to be downloaded, and
        # WeasyPrint still works without it. So ONE apt failure is a warning instead of an
        # error: the install cannot fetch a package because its mirror is unreachable, and
        # Pango is there. Only the install's own "E: Failed to fetch" line decides that; what
        # 'apt-get update' printed about other sources does not. Every other failure (update
        # fails, a package no longer exists, a broken install) fails the step as before, and
        # if WeasyPrint cannot load after all, the PDF tests fail (LANGWICH_REQUIRE_PDF).
        # tests/test_ci.py runs this step with apt stubbed.
        run: |
          set -o pipefail
          sudo apt-get update
          log="$RUNNER_TEMP/apt-install.log"
          {
            sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          } 2>&1 | tee "$log" && exit 0
          unreachable='Temporary failure resolving|Could not resolve|Could not connect|Connection timed out|Network is unreachable'
          if ! grep -qE "^E: Failed to fetch .*($unreachable)" "$log"; then
            echo "::error::The libraries could not be installed, and not because the package mirror was unreachable."
            exit 1
          fi
          echo "::warning::The package mirror could not be reached: going on with the libraries of the runner image."
          dpkg -s libpango-1.0-0 libpangoft2-1.0-0 > /dev/null
      - name: Install langwich
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Schema is up to date
        run: python scripts/export_schema.py --check
      - name: Tests
        run: pytest -q
      - name: Showcase PDFs match the renderer
        if: matrix.python-version == '3.12'
        run: python scripts/build_showcase.py --check

  minimum:
    # The oldest versions pyproject.toml allows, so the declared floors stay true.
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install WeasyPrint system libraries
        # The runner image ships Pango; only libharfbuzz-subset0 has to be downloaded, and
        # WeasyPrint still works without it. So ONE apt failure is a warning instead of an
        # error: the install cannot fetch a package because its mirror is unreachable, and
        # Pango is there. Only the install's own "E: Failed to fetch" line decides that; what
        # 'apt-get update' printed about other sources does not. Every other failure (update
        # fails, a package no longer exists, a broken install) fails the step as before, and
        # if WeasyPrint cannot load after all, the PDF tests fail (LANGWICH_REQUIRE_PDF).
        # tests/test_ci.py runs this step with apt stubbed.
        run: |
          set -o pipefail
          sudo apt-get update
          log="$RUNNER_TEMP/apt-install.log"
          {
            sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          } 2>&1 | tee "$log" && exit 0
          unreachable='Temporary failure resolving|Could not resolve|Could not connect|Connection timed out|Network is unreachable'
          if ! grep -qE "^E: Failed to fetch .*($unreachable)" "$log"; then
            echo "::error::The libraries could not be installed, and not because the package mirror was unreachable."
            exit 1
          fi
          echo "::warning::The package mirror could not be reached: going on with the libraries of the runner image."
          dpkg -s libpango-1.0-0 libpangoft2-1.0-0 > /dev/null
      - name: Install langwich with the minimum versions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "weasyprint==65.*" "pydantic==2.11.*" "pillow==10.0.*"
      # test_render.py checks page breaks tuned to the newest WeasyPrint; here it is
      # enough that everything else passes and every example renders to a PDF.
      - name: Tests
        run: pytest -q --ignore=tests/test_render.py
      - name: Every example renders
        run: for f in examples/*.json; do langwich render "$f" -o "$RUNNER_TEMP/" || exit 1; done
