name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/langwich/**"
      - "examples/**"
      - "scripts/update_page_stats.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the contract dependencies
        run: pip install "pydantic>=2.11,<3"
      - name: Sync live counts from the langwich/3 contract
        run: python3 scripts/update_page_stats.py
      # The schema's "$id" is https://joernmht.github.io/langwich/schema/langwich-3.json:
      # publish the checked-in copy at exactly that address.
      - name: Publish the JSON Schema
        run: mkdir -p docs/schema && cp src/langwich/schema/langwich-3.json docs/schema/langwich-3.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
